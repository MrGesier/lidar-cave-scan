[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-cave-scan"
version = "2.1.0"
description = "LiDAR DEM depression screening and experimental SAR micro-motion utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "matplotlib>=3.8",
]

[project.scripts]
lidar-cave-scan = "lidar_cave_scan.cli:main"
lidar-cave-scan-gui = "lidar_cave_scan.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
